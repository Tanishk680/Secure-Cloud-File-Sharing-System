AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Secure Cloud File Sharing System

Parameters:
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  LambdaRoleArn:
    Type: String
    Description: >-
      ARN of an existing IAM role for Lambda execution. Restricted lab accounts
      (e.g. AWS Academy) cannot create roles, so a pre-provisioned role such as
      arn:aws:iam::<account-id>:role/LabRole is reused by all functions.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    Environment:
      Variables:
        S3_BUCKET_NAME: !Ref FilesBucket
        DYNAMODB_FILES_TABLE: !Ref FilesTable
        DYNAMODB_SHARES_TABLE: !Ref SharesTable
        FILES_OWNER_INDEX: ownerId-index
        SHARES_FILE_INDEX: fileId-index
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoClientId

Resources:
  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000

  FilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: fileId
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
      KeySchema:
        - AttributeName: fileId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ownerId-index
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  SharesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: shareId
          AttributeType: S
        - AttributeName: fileId
          AttributeType: S
      KeySchema:
        - AttributeName: shareId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: fileId-index
          KeySchema:
            - AttributeName: fileId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  CreateUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: functions/createUploadUrl.handler
      Role: !Ref LambdaRoleArn
      Events:
        CreateUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /files/upload-url
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  ConfirmUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: functions/confirmUpload.handler
      Role: !Ref LambdaRoleArn
      Events:
        ConfirmUpload:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /files
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  ListFilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: functions/listFiles.handler
      Role: !Ref LambdaRoleArn
      Events:
        ListFiles:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /files
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  CreateDownloadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: functions/createDownloadUrl.handler
      Role: !Ref LambdaRoleArn
      Events:
        Download:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /files/{fileId}/download-url
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  DeleteFileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: functions/deleteFile.handler
      Role: !Ref LambdaRoleArn
      Events:
        DeleteFile:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /files/{fileId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  CreateShareFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: functions/createShare.handler
      Role: !Ref LambdaRoleArn
      Events:
        CreateShare:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /files/{fileId}/shares
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  ResolveShareFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: functions/resolveShare.handler
      Role: !Ref LambdaRoleArn
      Events:
        ResolveShare:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /shares/{shareId}
            Method: GET
            Auth:
              Authorizer: NONE

  ListSharesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: functions/listShares.handler
      Role: !Ref LambdaRoleArn
      Events:
        ListShares:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /files/{fileId}/shares
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  RevokeShareFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: functions/revokeShare.handler
      Role: !Ref LambdaRoleArn
      Events:
        RevokeShare:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /shares/{shareId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,DELETE,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,DELETE,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod
  S3BucketName:
    Description: S3 bucket for file storage
    Value: !Ref FilesBucket
  FilesTableName:
    Description: DynamoDB files table
    Value: !Ref FilesTable
  SharesTableName:
    Description: DynamoDB shares table
    Value: !Ref SharesTable
